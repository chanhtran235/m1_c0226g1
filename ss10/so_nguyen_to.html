<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
 // in ra các số nguyên tố từ 0 ến 1000
 document.write("-------------In ra các số nguyn tố từ 0 đến 100--------------------<br>")
    for (let n = 2; n <=100 ; n++) {
        let count =0;
        for (let i = 2; i <n ; i++) {
            if (n%i ==0){
                count ++;
            }
        }
        if (count==0){
            document.write(n + ",")
        }
    }

    document.write("<br>===================== in ra 20 số nguyn tô đầu tiên trong dãy số tự nhiên===================<br>")

    let n =2;
    let primeCount = 0;
    while (primeCount <20){
        let count =0;
        for (let i = 2; i <n ; i++) {
            if (n%i ==0){
                count ++;
            }
        }
        if (count==0){
            document.write(n + ",")
            primeCount ++;

        }
        n++;
    }
    // in ra 20 số nguyên tố


</script>
</body>
</html>
