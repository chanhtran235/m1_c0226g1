<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

</head>
<body>
<div style="width: 800px ;margin-left: 100px">
    <h2>Product Management</h2>
    <form>
        <h3>Create product</h3>
        <input id="name" placeholder="Enter name"><br>
        <button class="btn btn-sm btn-success" type="button" onclick="addNew()">Save</button>
    </form>
    <h3>Product List</h3>
    <div id="display"></div>
</div>

<script>
    let productList = ["Nokia", "Sam Sung", "Iphone"];
    let productList1 = [];
    display(productList);

    function addNew() {
        let newProduct = document.getElementById("name").value;
        if (newProduct != "") {
            productList.push(newProduct);
            document.getElementById("name").value = "";
            display(productList);
        } else {
            alert("Require input data");
        }
    }

    function deleteByIndex(i) {
        let isDelete = confirm(`Do you want to delete: ${productList[i]}???`);
        if (isDelete) {
            productList.splice(i, 1);
            display(productList)
        }

    }

    function display(list) {
        let tableString = `<table class="table table-dark table-striped">
                                <tr>
                                    <th>No</th>
                                    <th>Name</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>`;
        for (let i = 0; i < list.length; i++) {
            tableString += ` <tr>
                                    <td>${i + 1}</td>
                                    <td>${list[i]}</td>
                                    <td><button class="btn btn-sm btn-primary">Edit</button></td>
                                    <td><button class="btn btn-sm btn-danger" onclick="deleteByIndex(`+i+`)">Delete</button></td>
                                </tr>`
        }
        tableString += `</table>`

        document.getElementById("display").innerHTML = tableString;
    }
</script>
</body>
</html>
