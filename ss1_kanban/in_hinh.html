<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let print =1;
    for (let i = 1; i <=6 ; i++) {
        for (let j = 1; j <14 ; j++) {
            if (j<=(12/2-i)||j>=(12/2+i)){
                document.write("&ensp;");
                print =1;
            }else {
                if (j<=12/2){
                    document.write(print);
                    print++;
                }else if(j<=12/2+i){
                    print--;
                    document.write(print-1);
                }else {
                    document.write("*")
                }

            }

        }
        document.write("<br>")
    }

</script>
</body>
</html>
