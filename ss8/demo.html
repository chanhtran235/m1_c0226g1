    let day = +prompt("nhập ngày");
    let month = +prompt("nhập tháng");
    let year = +prompt("nhập năm");
    let maxDay;
    // giới hạn ngày lớp nhất trong thang theo năm
    if (month === 2) {
        if (isLeapYear(year)) {
            maxDay = 29;
        } else {
            maxDay = 28;
        }
    } else if (month === 4 || month === 6 || month === 9 || month === 11) {
        maxDay = 30;
    } else {
        maxDay = 31;
    }

    // tính ngày tiếp theo
    if (day < maxDay) {
        day++;
    } else {
        day = 1;
        if (month === 12) {
            month = 1;
            year++;
        } else {
            month++;
        }
    }
    alert(`${day}/${month}/${year}`);

    function isLeapYear(year) {
        return (year % 400 === 0) || (year % 4 === 0 && year % 100 !== 0);
    }
